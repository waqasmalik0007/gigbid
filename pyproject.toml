[project]
name = "gigbid"
version = "1.0.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG)"
requires-python = ">=3.11"
# Pinned to the versions the evaluation results were produced with (pip freeze, 2026-11-13).
dependencies = [
  "langgraph==1.2.21",
  "langgraph-checkpoint==4.3.1",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-supervisor==0.0.31",
  "langchain-core==1.8.0",
  "langchain-groq==1.1.3",
  "langchain-mcp-adapters==0.3.2",
  "mcp[cli]==1.30.0",
  "fastapi==0.162.6",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
  "sse-starlette==3.7.0",
  "python-multipart==0.0.33",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.9",
  "redis==5.3.1",
  "arq==0.28.0",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "sentence-transformers==5.4.1",
  "transformers==5.7.0",
  "torch==2.11.0",
  "pypdf==7.1.0",
  "networkx==3.7",
  "cryptography==50.0.2",
  "pyjwt==2.15.1",
  "bcrypt==5.0.0",
  "tenacity==9.2.1",
  "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5", "kaggle==2.2.5"]

[project.scripts]
gigbid-portfolio-mcp = "mcp_servers.portfolio.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "mcp_servers*", "gigsim*", "apps*", "worker*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["apps/web"]

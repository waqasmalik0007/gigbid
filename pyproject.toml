[project]
name = "gigbid"
version = "0.1.0"
description = "GigBid: a multi-agent freelancer copilot (LangGraph + MCP + advanced RAG)"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "langgraph-supervisor>=0.0.27",
  "langchain-core>=0.3",
  "langchain-groq>=0.3",
  "langchain-ollama>=0.3",
  "langchain-mcp-adapters>=0.1",
  "mcp[cli]>=1.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0",
  "redis>=5.0",
  "arq>=0.26",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0",
  "qdrant-client>=1.11",
  "pypdf>=4.3",
  "networkx>=3.3",
  "cryptography>=43",
  "passlib[bcrypt]>=1.7",
  "pyjwt>=2.9",
  "langfuse>=2.50",
  "tenacity>=9.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "syrupy>=4.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "mcp_servers"]

[tool.ruff]
line-length = 110

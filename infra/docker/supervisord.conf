[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gigsim]
command=uvicorn gigsim.app:app --host 127.0.0.1 --port 8100
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=uvicorn apps.api.main:app --host 127.0.0.1 --port 8000
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=sh -c 'if [ -n "$REDIS_URL" ]; then arq worker.tasks.WorkerSettings; else sleep infinity; fi'
directory=/app
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=node /web/server.js
directory=/web
environment=PORT="7860",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

# docker compose -f infra/docker-compose.yml up --build
# web, api, worker, MCP servers, GigSim, Postgres, Redis, Qdrant (vector store) and Ollama (open profile, local).
x-py: &py
  build: { context: .., dockerfile: infra/docker/python.Dockerfile }
  env_file: ../.env
  environment: &pyenv
    DATABASE_URL: postgresql://gigbid:gigbid@postgres:5432/gigbid
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    GIGSIM_BASE_URL: http://gigsim:8100
    MCP_TRANSPORT: http
    MCP_PORTFOLIO_URL: http://mcp-portfolio:8201/mcp
    MCP_MARKETPLACE_URL: http://mcp-marketplace:8202/mcp
    MCP_WORKSPACE_URL: http://mcp-workspace:8203/mcp
    OLLAMA_BASE_URL: http://ollama:11434
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.10-alpine
    environment: { POSTGRES_USER: gigbid, POSTGRES_PASSWORD: gigbid, POSTGRES_DB: gigbid }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U gigbid"], interval: 5s, retries: 10 }
  redis:
    image: redis:7.4.5-alpine
  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes: [qdrant:/qdrant/storage]
  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["local"]            # docker compose --profile local up  (GIGBID_PROFILE=local)
    volumes: [ollama:/root/.ollama]

  gigsim:
    <<: *py
    command: uvicorn gigsim.app:app --host 0.0.0.0 --port 8100
    environment: { <<: *pyenv, GIGSIM_DB: /state/gigsim.sqlite3 }
    volumes: [gigsim:/state]
  mcp-portfolio:
    <<: *py
    command: python -m mcp_servers.portfolio.server --http 8201
  mcp-marketplace:
    <<: *py
    command: python -m mcp_servers.marketplace.server --http 8202
    depends_on: [gigsim]
  mcp-workspace:
    <<: *py
    command: python -m mcp_servers.workspace.server --http 8203
  api:
    <<: *py
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mcp-marketplace: { condition: service_started }
  worker:
    <<: *py
    command: arq worker.tasks.WorkerSettings
    depends_on: [api, redis]
  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]

volumes: { pgdata: {}, qdrant: {}, ollama: {}, gigsim: {} }

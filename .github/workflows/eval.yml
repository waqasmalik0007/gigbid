name: eval
on: [pull_request, workflow_dispatch]
jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_HUB_DISABLE_XET: "1"
      MCP_TRANSPORT: inproc
      GIGSIM_ERROR_RATE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          pip install -e ".[dev]"
      - name: Start GigSim
        run: nohup uvicorn gigsim.app:app --port 8100 > gigsim.log 2>&1 &
      - name: Retrieval metrics (no LLM)
        run: python -m evals.runners.rag_eval --variants v0_naive best --limit 30 --tag ci
      - name: 30-job smoke eval with failure thresholds
        run: python -m evals.runners.smoke_eval --jobs 30
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: evals/results/*ci* }

name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { HF_HUB_DISABLE_XET: "1", MCP_TRANSPORT: inproc, GIGSIM_ERROR_RATE: "0" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          pip install -e ".[dev]"
      - name: Repository rules (secrets, frozen gigsim, prompts in files, README numbers)
        run: python tools/ci_checks.py
      - name: Lint
        run: ruff check . --select F,E9
      - name: Unit + contract (MCP schema snapshots) + integration
        run: pytest -q tests
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - name: Generated client is up to date with the API schema
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Playwright (mocked API)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report }

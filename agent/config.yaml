# All models, budgets, thresholds and policy rules live here, never in code.
profile: open
profiles:
  open:
    provider: groq
    nodes:
      scout: {model: "openai/gpt-oss-20b"}
      job_analyst: {model: "openai/gpt-oss-20b"}
      risk_assessor: {model: "openai/gpt-oss-20b"}
      fit_matcher: {model: "openai/gpt-oss-20b"}
      pricing: {model: "openai/gpt-oss-20b"}
      writer: {model: "openai/gpt-oss-120b"}
      verifier: {model: "openai/gpt-oss-20b"}
      critic: {model: "openai/gpt-oss-120b"}
      compliance: {model: "openai/gpt-oss-20b"}
      liaison: {model: "openai/gpt-oss-120b"}
    fallback_model: "qwen/qwen3.8-27b"
    injection_classifier: "meta-llama/llama-prompt-guard-2-86m"
    embeddings: "BAAI/bge-m3"
    reranker: "BAAI/bge-reranker-v2-m3"
  open_qwen:   # second open configuration for the "choose by measurement" comparison
    provider: groq
    nodes:
      default: {model: "qwen/qwen3.8-27b"}
    fallback_model: "openai/gpt-oss-20b"
    embeddings: "BAAI/bge-m3"
    reranker: "BAAI/bge-reranker-v2-m3"
  local:
    provider: ollama
    nodes:
      default: {model: "qwen3:8b"}
    embeddings: "nomic-embed-text"
    reranker: "BAAI/bge-reranker-v2-m3"
  paid:
    provider: openai
    nodes:
      default: {model: "gpt-4.1-mini"}
    embeddings: "BAAI/bge-m3"
    reranker: "BAAI/bge-reranker-v2-m3"

rag:
  variant: best              # contextual + hybrid, chosen by evals/results/rag_main.json
  top_k: 8

budgets:
  max_steps_per_thread: 40
  max_tokens_per_thread: 60000
  critic_max_loops: 2
  p95_latency_s_per_job: 20
  usd_per_proposal: 0.01

decision:
  bid_threshold: 0.65
  watch_threshold: 0.45
  max_risk: 0.7

eval_thresholds:          # CI smoke eval fails below these (evals/runners/smoke_eval.py)
  min_bid_f1: 0.5
  min_scam_recall: 0.8
  min_recall_at_5: 0.4

scheduling:
  gigsim_scout_interval_min: 30
  upwork_scout_interval_min: 180

policy_pack_path: data/policy_pack

# Signature extension X2: proposal A/B experiments (docs/EXTENSION.md). Arms are prompt addenda;
# a job's arm is fixed by hashing its job_id, so re-runs and retries stay in the same arm.
experiments:
  proposal_opening:
    enabled: true
    arms:
      A: "Opening: restate the client's core problem in one sentence, then give your single most relevant past result."
      B: "Opening: ask one specific question about the client's project that proves you read the post, then give your single most relevant past result."
